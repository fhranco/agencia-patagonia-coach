name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Inject secrets
        run: |
          cat > public/secrets.php << 'EOF'
          <?php
          return [
            'deepseek_key_chat' => '${{ secrets.DEEPSEEK_KEY_CHAT }}',
            'deepseek_key_api'  => '${{ secrets.DEEPSEEK_KEY_API }}',
            'admin_email'       => 'agente@agenciapatagoniacoach.cl',
            'contact_email'     => 'contacto@agenciapatagoniacoach.cl',
            'site_email'        => 'no-reply@agenciapatagoniacoach.cl',
            'whatsapp'          => '+56995684198',
          ];
          EOF

      - name: Build project
        run: npm run build

      - name: Prerender & generate sitemap
        run: npm run postbuild

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          protocol: ftp
          port: 21
